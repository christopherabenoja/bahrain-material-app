<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bahrain Material Search</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/msal/2.38.3/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --blue: #0f62fe;
    --gray-bg: #f4f6f8;
    --border: #d0d7de;
    --text: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    background: var(--gray-bg);
    color: var(--text);
  }
  header {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  button {
    background: var(--blue);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #0043ce; }
  button.secondary {
    background: white;
    color: var(--blue);
    border: 1px solid var(--blue);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
  }
  .status {
    font-size: 13px;
    color: #57606a;
    margin-top: 6px;
  }
  .status.error { color: #cf222e; }
  .status.ok { color: #1a7f37; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: top;
  }
  th {
    width: 40%;
    color: #57606a;
    font-weight: 600;
  }
  .sheet-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .sheet-toggle button {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .sheet-toggle button.active {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
  }
  .hidden { display: none; }
  .file-info {
    font-size: 13px;
    color: #57606a;
  }
</style>
</head>
<body>

<header>
  <h1>Bahrain Material Search</h1>
  <div id="authArea"></div>
</header>

<div class="container">

  <div class="card" id="signedOutCard">
    <p>Sign in with your company Microsoft account to load the latest material file.</p>
    <button id="loginBtn">Sign in</button>
  </div>

  <div class="card hidden" id="uploadCard">
    <h3 style="margin-top:0;">Update material file</h3>
    <p class="file-info">Upload the latest monthly Bahrain material file. This replaces the shared copy everyone searches against.</p>
    <input type="file" id="fileInput" accept=".xlsx,.xlsb,.xls" />
    <div style="margin-top:10px;">
      <button id="uploadBtn">Upload &amp; publish</button>
    </div>
    <div class="status" id="uploadStatus"></div>
  </div>

  <div class="card hidden" id="searchCard">
    <div class="sheet-toggle">
      <button id="sheet1Btn" class="active">Sheet 1 (core columns)</button>
      <button id="sheet2Btn">Full columns</button>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Enter subcode..." />
      <button id="searchBtn">Search</button>
    </div>
    <div class="status" id="searchStatus"></div>
    <div id="resultArea"></div>
  </div>

</div>

<script>
/* ====================== CONFIG ====================== */
const msalConfig = {
  auth: {
    clientId: "cf8f1f51-69b4-4015-b224-7cb9b378d61e",
    authority: "https://login.microsoftonline.com/3e049ef2-19d4-4c16-ae1b-82d2a3a0af6a",
    redirectUri: "https://christopherabenoja.github.io/bahrain-material-app/"
  },
  cache: {
    cacheLocation: "sessionStorage"
  }
};

// Path to the shared material file inside OneDrive/SharePoint.
// This is relative to the signed-in user's OneDrive root.
const FILE_PATH = "/TM/Internal/Chris/BMF/BMF.xlsx";

const graphScopes = ["User.Read", "Files.Read.All"];
/* ====================================================== */

const msalInstance = new msal.PublicClientApplication(msalConfig);
let account = null;
let workbookData = null; // { sheet1: [...], sheetAll: [...] }
let activeSheet = "sheet1";

const authArea = document.getElementById("authArea");
const signedOutCard = document.getElementById("signedOutCard");
const uploadCard = document.getElementById("uploadCard");
const searchCard = document.getElementById("searchCard");

async function init() {
  const resp = await msalInstance.handleRedirectPromise();
  if (resp && resp.account) {
    account = resp.account;
  } else {
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) account = accounts[0];
  }
  updateUI();
  if (account) loadFile();
}

function updateUI() {
  if (account) {
    authArea.innerHTML = `<span style="margin-right:12px;font-size:14px;">${account.username}</span>` +
      `<button class="secondary" id="logoutBtn">Sign out</button>`;
    document.getElementById("logoutBtn").onclick = () => msalInstance.logoutRedirect();
    signedOutCard.classList.add("hidden");
    uploadCard.classList.remove("hidden");
    searchCard.classList.remove("hidden");
  } else {
    authArea.innerHTML = "";
    signedOutCard.classList.remove("hidden");
    uploadCard.classList.add("hidden");
    searchCard.classList.add("hidden");
  }
}

document.getElementById("loginBtn").onclick = () => {
  msalInstance.loginRedirect({ scopes: graphScopes });
};

async function getToken() {
  try {
    const result = await msalInstance.acquireTokenSilent({
      scopes: graphScopes,
      account: account
    });
    return result.accessToken;
  } catch (e) {
    const result = await msalInstance.acquireTokenRedirect({ scopes: graphScopes });
    return null; // page will redirect
  }
}

/* ---------- Load the shared file from OneDrive via Graph ---------- */
async function loadFile() {
  const status = document.getElementById("searchStatus");
  status.textContent = "Loading material file...";
  status.className = "status";
  try {
    const token = await getToken();
    if (!token) return;

    const url = `https://graph.microsoft.com/v1.0/me/drive/root:${encodeURI(FILE_PATH)}:/content`;
    const res = await fetch(url, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (!res.ok) {
      throw new Error(`Could not load file (HTTP ${res.status}). Check FILE_PATH matches the OneDrive location.`);
    }

    const buffer = await res.arrayBuffer();
    parseWorkbook(buffer);
    status.textContent = "Material file loaded. Ready to search.";
    status.className = "status ok";
  } catch (err) {
    status.textContent = err.message;
    status.className = "status error";
  }
}

function parseWorkbook(buffer) {
  const wb = XLSX.read(buffer, { type: "array" });
  const sheetNames = wb.SheetNames;

  // Matches the real workbook: "Sheet1" = core columns, "complete" = full columns.
  const sheet1Name = sheetNames.find(n => n.toLowerCase() === "sheet1") || sheetNames[0];
  const sheetAllName = sheetNames.find(n => n.toLowerCase() === "complete") || sheetNames[1] || sheetNames[0];

  workbookData = {
    sheet1: XLSX.utils.sheet_to_json(wb.Sheets[sheet1Name], { defval: "" }),
    sheetAll: XLSX.utils.sheet_to_json(wb.Sheets[sheetAllName], { defval: "" })
  };
}

/* ---------- Upload replacement file ---------- */
document.getElementById("uploadBtn").onclick = async () => {
  const fileInput = document.getElementById("fileInput");
  const status = document.getElementById("uploadStatus");
  if (!fileInput.files.length) {
    status.textContent = "Choose a file first.";
    status.className = "status error";
    return;
  }
  const file = fileInput.files[0];
  status.textContent = "Uploading...";
  status.className = "status";

  try {
    const token = await getToken();
    if (!token) return;

    const url = `https://graph.microsoft.com/v1.0/me/drive/root:${encodeURI(FILE_PATH)}:/content`;
    const res = await fetch(url, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/octet-stream"
      },
      body: file
    });

    if (!res.ok) throw new Error(`Upload failed (HTTP ${res.status}).`);

    status.textContent = "Uploaded. Everyone's next search will use this version.";
    status.className = "status ok";

    // Refresh local view immediately too
    const buf = await file.arrayBuffer();
    parseWorkbook(buf);
  } catch (err) {
    status.textContent = err.message;
    status.className = "status error";
  }
};

/* ---------- Sheet toggle ---------- */
document.getElementById("sheet1Btn").onclick = () => {
  activeSheet = "sheet1";
  document.getElementById("sheet1Btn").classList.add("active");
  document.getElementById("sheet2Btn").classList.remove("active");
};
document.getElementById("sheet2Btn").onclick = () => {
  activeSheet = "sheetAll";
  document.getElementById("sheet2Btn").classList.add("active");
  document.getElementById("sheet1Btn").classList.remove("active");
};

/* ---------- Search ---------- */
document.getElementById("searchBtn").onclick = doSearch;
document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doSearch();
});

function doSearch() {
  const status = document.getElementById("searchStatus");
  const resultArea = document.getElementById("resultArea");
  const query = document.getElementById("searchInput").value.trim().toLowerCase();

  if (!workbookData) {
    status.textContent = "File not loaded yet.";
    status.className = "status error";
    return;
  }
  if (!query) {
    status.textContent = "Enter a subcode to search.";
    status.className = "status error";
    return;
  }

  const rows = workbookData[activeSheet];

  // Matches against the real workbook headers: "Material Code" (primary) and "FPC Code" (secondary).
  const subcodeKeys = ["Material Code", "FPC Code"];

  const match = rows.find(row => {
    return Object.keys(row).some(key => {
      const normalizedKey = key.trim().toLowerCase();
      const isSubcodeCol = subcodeKeys.some(k => normalizedKey === k.toLowerCase());
      if (!isSubcodeCol) return false;
      return String(row[key]).trim().toLowerCase() === query;
    });
  });

  if (!match) {
    status.textContent = "No match found for that subcode.";
    status.className = "status error";
    resultArea.innerHTML = "";
    return;
  }

  status.textContent = "Match found.";
  status.className = "status ok";

  let html = "<table>";
  for (const [key, value] of Object.entries(match)) {
    html += `<tr><th>${key}</th><td>${value}</td></tr>`;
  }
  html += "</table>";
  resultArea.innerHTML = html;
}

init();
</script>

</body>
</html>
